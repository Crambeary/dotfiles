[config]
fallback_color = "#8aadf4"
prefer = "closest-to-fallback"

# Anchored hues for roles where the semantic color matters more than harmony
# with the wallpaper. Herdr's status icons use green/yellow to mean
# complete/in-progress; the generic Material primary/tertiary roles aren't
# guaranteed to land anywhere near those hues (e.g. a warm wallpaper can put
# primary on gold and tertiary on sage, silently swapping the two icons'
# apparent meaning). blend = true still tints them to the theme.
[config.custom_colors]
green = { color = "#a6e3a1", blend = true }
yellow = { color = "#f9e2af", blend = true }

[config.wallpaper]
set = true
command = "wallpaper set {{image}} --scale fill"

# --- kitty -------------------------------------------------------------
[templates.kitty]
input_path = "templates/kitty.conf"
output_path = "~/.config/kitty/matugen-theme.conf"
post_hook = 'for s in /tmp/kitty-*; do [ -S "$s" ] && kitty @ --to "unix:$s" set-colors -a ~/.config/kitty/matugen-theme.conf; done; true'

# --- Sketchybar ----------------------------------------------------------
[templates.sketchybar]
input_path = "templates/sketchybar-colors.sh"
output_path = "~/.config/sketchybar/colors-matugen.sh"
post_hook = "sketchybar --reload"

# --- AeroSpace (via the `borders` helper) --------------------------------
[templates.aerospace-borders]
input_path = "templates/aerospace-borders.sh"
output_path = "~/.config/aerospace/borders.sh"
post_hook = "chmod +x ~/.config/aerospace/borders.sh && ~/.config/aerospace/borders.sh"

# --- Vicinae ---------------------------------------------------------------
[templates.vicinae]
input_path = "templates/vicinae.toml"
output_path = "~/.local/share/vicinae/themes/matugen.toml"
post_hook = "/Applications/Vicinae.app/Contents/MacOS/vicinae-cli theme set matugen"

# --- Herdr -------------------------------------------------------------
# Shares its input template and post_hook with the Linux config
# (private_dot_config/matugen/config.toml) -- both point at the same
# ~/.config/matugen/templates/herdr.toml and ~/.config/herdr/scripts/
# apply-matugen-theme.sh, which chezmoi deploys identically on every
# platform. That script is a no-op if either file it needs is missing, so a
# machine without matugen installed (or before its first run) just keeps
# herdr's plain built-in theme -- no error, no half-applied state.
[templates.herdr]
input_path = "~/.config/matugen/templates/herdr.toml"
output_path = "~/.config/herdr/matugen-theme.toml"
post_hook = "~/.config/herdr/scripts/apply-matugen-theme.sh"

# --- Helix ---------------------------------------------------------------
# Shares its input template with the Linux config
# (private_dot_config/matugen/config.toml), same as Herdr above.
[templates.helix]
input_path = "~/.config/matugen/templates/helix.toml"
output_path = "~/.config/helix/themes/matugen.toml"
post_hook = "pkill -USR1 -x hx || true"

# --- Glow ------------------------------------------------------------------
# Shares its input template with the Linux config
# (private_dot_config/matugen/config.toml), same as Herdr/Helix above. yazi's
# glow-preview commands pick this file over the built-in catppuccin-mocha.json
# style whenever `matugen` is on PATH (see private_dot_config/yazi/*.tmpl).
#
# glow.json's own placeholders use <{ }> instead of matugen's default {{ }}
# because Glow's "image_text" style has a literal {{.text}} in its own
# Go-template syntax, which matugen's default {{ }} parser tries to evaluate
# as an expression and crashes on -- taking down the entire matugen run
# (every other template too) since matugen aborts a run instead of skipping
# a single bad template. expr_prefix/expr_postfix tell matugen to look for
# <{ }> in this template only, leaving Glow's own {{.text}} alone.
[templates.glow]
input_path = "~/.config/matugen/templates/glow.json"
output_path = "~/.config/glow/matugen.json"
expr_prefix = "<{"
expr_postfix = "}>"

# --- Zed -------------------------------------------------------------------
# macOS-only: Zed's theme on Linux is generated by DankMaterialShell (see
# private_dot_config/zed/themes/dank-zed-theme.json), which has no macOS
# equivalent. This template outputs a single "Matugen Dynamic" theme whose
# appearance tracks matugen's current mode, referenced directly in
# settings.json.tmpl on darwin -- no light/dark pair to keep in sync, same
# as Vicinae above. Zed watches its themes directory and reloads live.
[templates.zed]
input_path = "templates/zed.json"
output_path = "~/.config/zed/themes/matugen-theme.json"
