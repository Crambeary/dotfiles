name: herdr-osc-status
version: "1.0"
description: Report Hermes working/idle/done/blocked to Herdr's agents list (OSC 7501 on the controlling terminal)
kind: standalone
provides_hooks:
  - on_session_start
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - pre_approval_request
  - post_approval_response
  - on_session_end
