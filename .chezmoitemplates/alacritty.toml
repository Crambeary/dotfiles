[keyboard]
bindings = [{ key = "N", mods = "Control|Shift", action = "CreateNewWindow" }]

[general]
import = ["./themes/themes/catppuccin_mocha.toml"]

{{- if eq .chezmoi.os "windows" }}

# Left unset, Alacritty launches Windows PowerShell 5.1 (powershell.exe), which
# lacks the LocationChangedAction hook mise's activation needs.
[terminal.shell]
program = "pwsh"
args = ["-NoLogo"]
{{- end }}

[font]
normal = { family = "Hack Nerd Font", style = "Regular" }

[window]
{{- if eq .chezmoi.os "windows" }}
decorations = "full"
{{- else }}
decorations = "none"
{{- end }}
padding = { x = 10, y = 10 }
opacity = 0.9
