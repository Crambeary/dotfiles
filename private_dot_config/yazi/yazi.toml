[opener]
# Windows only: yazi's built-in unix opener already uses $EDITOR (set to hx in
# dot_zshrc.tmpl), but its built-in windows default is "code", not $EDITOR-aware.
edit = [
  { run = 'hx %s', block = true, desc = "Edit with hx", for = "windows" },
]

[open]
prepend_rules = [
  { mime = "text/*", use = "edit" },
  { mime = "*/json", use = "edit" },
  { mime = "*/xml", use = "edit" },
  { mime = "*/toml", use = "edit" },
  { mime = "*/x-yaml", use = "edit" },
  { mime = "*/x-empty", use = "edit" },
  { mime = "inode/x-empty", use = "edit" },
]

[preview]
max_width=10000
max_height=10000
image_filter="lanczos3"

[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s="$HOME/.config/glow/catppuccin-mocha.json" "$1"'
