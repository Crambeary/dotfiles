# Keep full-width diff rows quiet enough for syntax colors to remain legible.
# Use semantic green/red hues; Material's tertiary can be purple, and its
# error_container is too saturated for a code background. Bound saturation
# and lightness in both modes rather than using those container colors.
<* if {{is_dark_mode}} *>
diff_add_bg = "{{colors.green.default.hex | set_lightness: 14.0 | set_saturation: 22.0}}"
diff_del_bg = "{{colors.error.default.hex | set_lightness: 14.0 | set_saturation: 22.0}}"
syntax_add_bg = "{{colors.green.default.hex | set_lightness: 14.0 | set_saturation: 22.0}}"
syntax_del_bg = "{{colors.error.default.hex | set_lightness: 14.0 | set_saturation: 22.0}}"
<* else *>
diff_add_bg = "{{colors.green.default.hex | set_lightness: 94.0 | set_saturation: 35.0}}"
