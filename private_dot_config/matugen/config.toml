[config]

# Anchored hues for roles where the semantic color matters more than harmony
# with the wallpaper. herdr's status icons use green/yellow to mean
# complete/in-progress; the generic Material primary/tertiary roles aren't
# guaranteed to land anywhere near those hues (e.g. a warm wallpaper can put
# primary on gold and tertiary on sage, silently swapping the two icons'
# apparent meaning). blend = true still tints them to the theme.
[config.custom_colors]
green = { color = "#a6e3a1", blend = true }
yellow = { color = "#f9e2af", blend = true }

[templates.herdr]
input_path = "/home/marc/.config/matugen/templates/herdr.toml"
output_path = "/home/marc/.config/herdr/matugen-theme.toml"
post_hook = "/home/marc/.config/herdr/scripts/apply-matugen-theme.sh"

[templates.obsidian-forge]
input_path = '/home/marc/.config/matugen/templates/obsidian.css'
output_path = '/home/marc/Documents/Forge/.obsidian/snippets/matugen.css'

[templates.helix]
input_path = '/home/marc/.config/matugen/templates/helix.toml'
output_path = '/home/marc/.config/helix/themes/matugen.toml'
post_hook = 'pkill -USR1 -x hx || true'

[templates.glow]
input_path = '/home/marc/.config/matugen/templates/glow.json'
output_path = '/home/marc/.config/glow/matugen.json'
# Glow's own "format" fields use Go template syntax ({{.text}}) that matugen
# would otherwise try (and fail) to parse as its own expression syntax, so
# this template uses non-default delimiters to avoid the collision.
expr_prefix = '<{'
expr_postfix = '}>'

[templates.opencode]
input_path = '/home/marc/.config/matugen/templates/opencode.json'
output_path = '/home/marc/.config/opencode/themes/matugen.json'
post_hook = 'pkill -USR2 -x opencode || true'

[templates.vicinae]
input_path = '/home/marc/.config/matugen/templates/vicinae.toml'
output_path = '/home/marc/.local/share/vicinae/themes/matugen.toml'
post_hook = '/home/marc/.config/matugen/scripts/apply-vicinae-theme.sh'

[templates.millennium-library]
input_path = '/home/marc/.config/matugen/templates/millennium.css'
output_path = '/home/marc/.steam/steam/millennium/themes/matugen/libraryroot.custom.css'

[templates.millennium-friends]
input_path = '/home/marc/.config/matugen/templates/millennium.css'
output_path = '/home/marc/.steam/steam/millennium/themes/matugen/friends.custom.css'

[templates.millennium-bigpicture]
input_path = '/home/marc/.config/matugen/templates/millennium.css'
output_path = '/home/marc/.steam/steam/millennium/themes/matugen/bigpicture.custom.css'

[templates.millennium-webkit]
input_path = '/home/marc/.config/matugen/templates/millennium.css'
output_path = '/home/marc/.steam/steam/millennium/themes/matugen/webkit.css'

[templates.millennium-quick-css]
input_path = '/home/marc/.config/matugen/templates/millennium.css'
output_path = '/home/marc/.config/millennium/quick.css'

[templates.rivalcfg]
input_path = '/home/marc/.config/matugen/templates/rivalcfg.sh'
output_path = '/home/marc/.config/rivalcfg/matugen-theme.sh'
post_hook = '/home/marc/.config/matugen/scripts/apply-rivalcfg-theme.sh'

[templates.millennium-material]
input_path = '/home/marc/.config/matugen/templates/millennium-material.css'
output_path = '/home/marc/.steam/steam/millennium/themes/Material-Theme/css/main/colors/matugen.css'
# Material-Theme's own matugentemplate.css (kuska1/Material-Theme) uses a
# `<* for name, value in colors *>` loop -- non-default block delimiters --
# while its value interpolation stays on matugen's default {{ }}. Only the
# block delimiters need overriding here.
block_prefix = '<*'
block_postfix = '*>'

