output_path = '/home/marc/.steam/steam/millennium/themes/Material-Theme/css/main/colors/matugen.css'
# Material-Theme's own matugentemplate.css (kuska1/Material-Theme) uses a
# `<* for name, value in colors *>` loop -- non-default block delimiters --
# while its value interpolation stays on matugen's default {{ }}. Only the
# block delimiters need overriding here.
block_prefix = '<*'
block_postfix = '*>'

