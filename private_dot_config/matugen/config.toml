[config]

# Anchored hues for roles where the semantic color matters more than harmony
# with the wallpaper. herdr's status icons use green/yellow to mean
# complete/in-progress; the generic Material primary/tertiary roles aren't
# guaranteed to land anywhere near those hues (e.g. a warm wallpaper can put
# primary on gold and tertiary on sage, silently swapping the two icons'
# apparent meaning). blend = true still tints them to the theme.
[config.custom_colors]
green = { color = "#a6e3a1", blend = true }
yellow = { color = "#f9e2af", blend = true }

[templates.papirus-folders]
input_path = '/home/marc/.config/matugen/templates/papirus-color'
colors_to_compare = [
    { name = "black",      color = "#4f4f4f" },
    { name = "blue",       color = "#5294e2" },
    { name = "bluegrey",   color = "#607d8b" },
    { name = "brown",      color = "#ae8e6c" },
    { name = "carmine",    color = "#a30002" },
    { name = "cyan",       color = "#00bcd4" },
    { name = "darkcyan",   color = "#45abb7" },
    { name = "deeporange", color = "#eb6637" },
    { name = "green",      color = "#87b158" },
    { name = "grey",       color = "#8e8e8e" },
    { name = "indigo",     color = "#5c6bc0" },
    { name = "magenta",    color = "#ca71df" },
    { name = "nordic",     color = "#81a1c1" },
    { name = "orange",     color = "#ee923a" },
    { name = "palebrown",  color = "#d1bfae" },
    { name = "paleorange", color = "#eeca8f" },
    { name = "pink",       color = "#f06292" },
    { name = "red",        color = "#e25252" },
    { name = "teal",       color = "#16a085" },
    { name = "violet",     color = "#7e57c2" },
    { name = "white",      color = "#e4e4e4" },
    { name = "yaru",       color = "#676767" },
    { name = "yellow",     color = "#f9bd30" },
]
compare_to = "{{ colors.primary.default.hex }}"
# Sudoers drop-in (/etc/sudoers.d/papirus-folders) pins the NOPASSWD rule to
# this exact absolute path, so this must match where papirus-folders is
# installed (/usr/local/bin, installed system-wide from upstream's
# install.sh with PREFIX=/usr/local). A symlink at that path currently
# points at the AUR package's binary (/usr/bin/papirus-folders) -- keep
# that symlink in place, since re-installing papirus-folders from AUR does
# not recreate it.
#
# The trailing dbus-send call emits KIconLoader's live-reload signal so
# already-running KDE/Qt apps (Dolphin, etc.) pick up the recolored folders
# immediately, matching how System Settings' own icon picker behaves --
# papirus-folders' own -u only rebuilds the on-disk icon cache, it doesn't
# notify running apps.
post_hook = 'nohup sh -c "sudo -n /usr/local/bin/papirus-folders -C {{ closest_color }} -u && dbus-send --session --type=signal /KIconLoader org.kde.KIconLoader.iconChanged int32:0" > /dev/null 2>&1 &'

