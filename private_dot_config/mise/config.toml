# Global mise tools. Project mise.toml files (agent-dev, Crambeary/skills)
# override these per directory; installs are shared, so a version installed for
# one is reused by the other.
#
# node and python are deliberately absent: nvm and uv own those, and
# activating mise's copies would shadow them (see notes/mise-vs-uv-nvm.md).
# npm:rulesync is pinned per project instead of globally.
#
# herdr comes from mise on every OS. Don't run `herdr update` -- on Windows it
# reinstalls herdr's self-managed preview build under
# %LOCALAPPDATA%\Programs\Herdr and puts it on PATH ahead of this one. Use
# `mise upgrade herdr`.
[tools]
herdr = "latest"
fd = "latest"
fnox = "latest"
jq = "latest"
ripgrep = "latest"
rtk = "latest"
sd = "latest"
uv = "latest"
# Not in the mise registry. The release also ships tuios-web_* and
# tuios-ghostty_* archives; pin the plain build. asset_pattern replaces
# autodetection, so it has to spell out the platform itself.
"github:Gaurav-Gosain/tuios" = { version = "latest", asset_pattern = "tuios_*_{{ os(macos=\"Darwin\", linux=\"Linux\", windows=\"Windows\") }}_{{ arch(x64=\"x86_64\") }}.tar.gz" }
