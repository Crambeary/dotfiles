  <rect x="24" y="24" width="30" height="9" rx="4.5" fill="#f9e2af"/>
  <rect x="24" y="41" width="76" height="9" rx="4.5" fill="#cdd6f4"/>
  <g fill="#585b70"><rect x="24" y="140" width="60" height="9" rx="4.5"/><rect x="24" y="158" width="72" height="9" rx="4.5"/><rect x="24" y="176" width="54" height="9" rx="4.5"/></g>
